<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ file_name }}</title>

    <meta
      name="description"
      content="Securely download your files with premium speed and privacy."
    />

    <meta property="og:title" content="{{ file_name }}" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://i.ibb.co/M8S0Zzj/live-streaming.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0f1115;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f5f7fa;
        --muted: #aab2c0;
        --accent: #4da3ff;
        --accent-hover: #77b8ff;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.35;
        animation: float 10s infinite ease-in-out;
      }

      .blob1 {
        width: 300px;
        height: 300px;
        background: #4da3ff;
        top: -100px;
        left: -100px;
      }

      .blob2 {
        width: 350px;
        height: 350px;
        background: #7c4dff;
        bottom: -120px;
        right: -120px;
        animation-delay: 2s;
      }

      .blob3 {
        width: 250px;
        height: 250px;
        background: #00d4ff;
        bottom: 20%;
        left: 10%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-30px);
        }
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 28px;
        padding: 40px;
        position: relative;
        z-index: 2;
        box-shadow: var(--shadow);
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon-wrap {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.05),
          0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 10px;
        word-break: break-word;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 32px;
      }

      .meta-box {
        flex: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        padding: 16px;
        text-align: center;
      }

      .meta-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }

      .meta-value {
        font-weight: 600;
        font-size: 15px;
      }

      .download-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        text-decoration: none;
        background: linear-gradient(135deg, var(--accent), #6ab7ff);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        padding: 18px;
        border-radius: 18px;
        overflow: hidden;
        transition: all 0.35s ease;
        box-shadow: 0 10px 30px rgba(77, 163, 255, 0.35);
      }

      .download-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(77, 163, 255, 0.45);
      }

      .download-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 80%;
        height: 100%;
        background: rgba(255, 255, 255, 0.25);
        transform: skewX(-20deg);
        transition: 0.7s;
      }

      .download-btn:hover::before {
        left: 130%;
      }

      .secure {
        margin-top: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .secure span {
        color: #4ade80;
        font-weight: 600;
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
      }

      @media (max-width: 520px) {
        .card {
          padding: 28px;
        }
        .title {
          font-size: 23px;
        }
        .meta {
          flex-direction: column;
        }
        .download-btn {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="card">
      <div class="icon-wrap">📁</div>

      <h1 class="title">{{ file_name }}</h1>

      <p class="subtitle">
        Secure premium file delivery with encrypted high-speed download.
      </p>

      <div class="meta">
        <div class="meta-box">
          <div class="meta-label">Type</div>
          <div class="meta-value">Media File</div>
        </div>

        <div class="meta-box">
          <div class="meta-label">Size</div>
          <div class="meta-value">{{ file_size }}</div>
        </div>

        <div class="meta-box">
          <div class="meta-label">Status</div>
          <div class="meta-value">Ready</div>
        </div>
      </div>

      <a href="{{ file_url }}" class="download-btn"> ⬇ Download File </a>

      <div class="secure">
        <span>✓ Secure</span> • Encrypted Transfer • Instant Access
      </div>

      <div class="footer">Powered by KUNAL</div>
    </div>
  </body>
</html>
